# ============================================================================
# Schäfer-Turek 2D-2 cylinder benchmark (Re=100), 3D thin slab + z-periodic
# ============================================================================
# Reference:
#   Schäfer, M. & Turek, S. (1996), DFG Priority Research Program 1993-1995.
#   Notes Numer. Fluid Mech. 52:547-566.
#
# DFG reference values (2D-2):
#   Cd_max ∈ [3.22, 3.24]
#   Cl_max ∈ [0.99, 1.01]
#   St     ∈ [0.295, 0.305]
#
# Usage:
#   build/aero_schaefer_turek_3d \
#       --case 2d-2 --re 100 --resolution 50 \
#       --steps 600000 --probe-every 100 \
#       --vtk-every 50000 \
#       --output-dir output_aero_st2d2_prod
#
#   python3 scripts/aero/strouhal_fft.py output_aero_st2d2_prod \
#       --U-avg 1.0 --assert-pass
# ============================================================================

# Physical / benchmark parameters (currently hardcoded in the driver, kept here
# for documentation; tweaks should match the CLI flags):
#
#   Domain:           Lx=2.2 m, Ly=0.41 m
#   Cylinder:         D=0.1 m, centre at (0.2, 0.2)
#   Inlet (parabolic): u_max=1.5 m/s,  u_avg=1.0 m/s
#   Outlet:           constant-pressure (rho=1)
#   Walls:            no-slip top/bottom (y), z-periodic
#   Reynolds:         Re = u_avg · D / nu = 100
#   Kinematic visc:   nu = 0.001 m²/s
#
# LBM settings:
#   Resolution:       D/dx = 50 → dx = 2 mm
#   Mesh:             1100 × 206 × 4  ≈  0.91 M cells
#   Time step:        dt = 0.05·dx/u_max = 6.67e-5 s   (u_max_LU = 0.05)
#   tau:              0.520 (TRT, Λ = 3/16)
#   Total steps:      ~600 000  ≈  40 s phys time, ~12 shedding cycles
#
# Smoke run (D/dx=20, ≈5 min on a single GPU):
#   build/aero_schaefer_turek_3d --case 2d-2 --re 100 --resolution 20 \
#       --steps 30000 --probe-every 50 --output-dir output_aero_2d2_smoke
#   python3 scripts/aero/strouhal_fft.py output_aero_2d2_smoke --U-avg 1.0
#
# Tolerance bands (current first-order stair-step BC at D/dx=20):
#   Cd_max:  ±20% relative to DFG centre
#   Cl_max:  ±30%
#   St:      ±10%
# Tighten to <5% after Phase 1b (Bouzidi QBB curved BC + D/dx≥50).
